# config.toml 
[general]
max_packet_size = 2048
pool_size = 65536
rx_queue_capacity = 65536
merge_queue_capacity = 65536
spin_loops_per_yield = 64
rx_recvmmsg_batch = 32
mlock_all = true

[sequence]
offset = 8
length = 4
endian = "le"

[parser]
kind = "eobi"
max_messages_per_packet = 128

[channels.a]
group = "239.10.10.1"
port = 5001
iface_addr = "10.0.0.11"
reuse_port = true
recv_buffer_bytes = 67108864
busy_poll_us = 50
nonblocking = true
timestamping = "hardware"

[channels.b]
group = "239.10.10.2"
port = 5001
iface_addr = "10.0.0.12"
reuse_port = true
recv_buffer_bytes = 67108864
busy_poll_us = 50
nonblocking = true
timestamping = "hardware"

[merge]
initial_expected_seq = 1
reorder_window = 512
max_pending_packets = 131072

[book]
max_depth = 50
snapshot_interval_ms = 1000
consume_trades = false
default_tick = 1
grid_span = 16384
order_slab_capacity = 1048576
order_index_capacity = 1048576
per_instrument_order_index_capacity = 1048576
# Reserve top-level book/tick maps for at least this many instruments.
# If omitted, the loaded refdata row count is used.
# instrument_capacity = 1024
# When true, eagerly creates books and per-instrument slabs for refdata instruments.
preallocate_instrument_books = false
instrument_ticks = []
# Optional CSV reference data. Header aliases: instr/instrument_id/security_id
# and tick/tick_size/minimum_price_increment.
# instrument_ticks_path = "/var/lib/t7_like/instrument_ticks.csv"

[cpu]
a_rx_core = 2
b_rx_core = 4
merge_core = 6
decode_core = 8
rt_priority = 80

[metrics]
bind = "0.0.0.0:9100"

[snapshot]
path = "/var/lib/t7_like/book.snap"
load_on_start = true
enable_writer = true

[journal]
path = "/var/lib/t7_like/book.journal"
enable_writer = false
record_state_hash = true

[recovery]
enable_injector = false
endpoint = "127.0.0.1:9000"
retry_attempts = 3
retry_backoff_ms = 10
min_request_interval_ms = 0
slo_ms = 100
unrecoverable_policy = "log"
request_timeout_ms = 250
# REPLAY request + [len, seq, payload] response frames.
replay_protocol = "len_seq_payload"

[afxdp]
enable = false
ifname = "eth0"
queues = 1

[packet_mmap]
enable = false
ifname = "eth0"
queues = 1
frame_size = 2048
frames_per_block = 1024
block_count = 4

[feeds]
enabled = false
pops = []

[feeds.obo]
enabled = false
client_write_timeout_ms = 250
client_handshake_timeout_ms = 1000
client_heartbeat_interval_ms = 1000
client_max_connections = 1024
client_nodelay = true

[feeds.obo.buffers]
pub_queue = 65536
